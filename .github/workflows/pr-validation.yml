name: PR validation

# Full validation runs normally. Package scope labels or the dispatch input
# limit a follow-up after the other checks have passed.
on:
  #push:
  #  branches: [cl102/feat]
  pull_request:
    branches: [main, integ2]
  workflow_dispatch:
    inputs:
      package-scope:
        description: Packages to recheck without repeating other passed checks.
        type: choice
        options: [all, netbsd-haiku, haiku-x86]
        default: all
      platforms:
        description: Nonempty JSON array of unique candidate platforms (dos, sdl3).
        type: string
        default: '["sdl3"]'
      cameras:
        description: Nonempty JSON array of unique renderer camera IDs (integers 1-4).
        type: string
        default: '[1,2]'
      targets:
        description: Nonempty JSON array of unique renderer target IDs (0 for player, 1 for opponent).
        type: string
        default: '[0,1]'
      renderer-test-percentage:
        description: Percentage of golden replays sampled for renderer tests (integer 1-100).
        type: number
        default: 100

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimages:
    name: Portable Linux AppImages
    if: >-
      ${{ inputs.package-scope != 'netbsd-haiku' && inputs.package-scope != 'haiku-x86' &&
          !contains(github.event.pull_request.labels.*.name, 'netbsd-haiku-only') &&
          !contains(github.event.pull_request.labels.*.name, 'haiku-x86-only') }}
    uses: ./.github/workflows/build-packages.yml
    with:
      only-appimages: true
      attest: false

  validate:
    name: Golden replays
    if: >-
      ${{ inputs.package-scope != 'netbsd-haiku' && inputs.package-scope != 'haiku-x86' &&
          !contains(github.event.pull_request.labels.*.name, 'netbsd-haiku-only') &&
          !contains(github.event.pull_request.labels.*.name, 'haiku-x86-only') }}
    uses: ./.github/workflows/build-and-validate.yml
    with:
      platforms: ${{ github.event.inputs.platforms || '["sdl3"]' }}
      # Every run packages DOS16, including an SDL3-only replay test selection.
      build-dos-artifact: true
      cameras: ${{ github.event.inputs.cameras || '[1,2]' }}
      targets: ${{ github.event.inputs.targets || '[0,1]' }}
      renderer-test-percentage: ${{ fromJSON(github.event.inputs.renderer-test-percentage || '100') }}

  packages:
    name: All release packages
    needs: validate
    if: >-
      ${{ !cancelled() &&
          (needs.validate.result == 'success' ||
           (needs.validate.result == 'skipped' &&
            (inputs.package-scope == 'netbsd-haiku' || inputs.package-scope == 'haiku-x86' ||
             contains(github.event.pull_request.labels.*.name, 'netbsd-haiku-only') ||
             contains(github.event.pull_request.labels.*.name, 'haiku-x86-only')))) }}
    uses: ./.github/workflows/build-packages.yml
    with:
      dos-artifact: ${{ needs.validate.outputs.exe-artifact }}
      skip-appimages: true
      package-scope: ${{ inputs.package-scope || (contains(github.event.pull_request.labels.*.name, 'haiku-x86-only') && 'haiku-x86') || (contains(github.event.pull_request.labels.*.name, 'netbsd-haiku-only') && 'netbsd-haiku') || 'all' }}
      attest: false
      android-release: false
