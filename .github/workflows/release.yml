name: Release

# Build and attest all packages, then publish the exact downloaded artifacts.
# The golden replay gates run only for DOS16 and native Linux SDL3.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Nonempty JSON array of unique candidate platforms to test (dos, sdl3).
        type: string
        default: '["sdl3"]'
      cameras:
        description: Nonempty JSON array of unique renderer camera IDs (integers 1-4).
        type: string
        default: '[1,2,3,4]'
      targets:
        description: Nonempty JSON array of unique renderer target IDs (0 for player, 1 for opponent).
        type: string
        default: '[0,1]'
      renderer-test-percentage:
        description: Percentage of golden replays sampled for renderer tests (integer 1-100).
        type: number
        default: 100
      tag:
        description: Tag to create for this release, for example v1.2.0.
        type: string
        required: true
      title:
        description: Release title. Defaults to the tag.
        type: string
        required: false
      prerelease:
        description: Mark the release as a prerelease.
        type: boolean
        default: false
      draft:
        description: Keep the verified release as a draft (mutable until published).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test release verification safeguards
        run: python3 -m unittest discover -s tools/scripts/tests -p 'test_release_integrity.py'

      - name: Reject a malformed or already used tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 tools/scripts/publish-release.py check-tag --tag "$TAG"

  validate:
    name: Golden replays
    needs: check-tag
    uses: ./.github/workflows/build-and-validate.yml
    with:
      platforms: ${{ inputs.platforms }}
      # The DOS16 package is required regardless of the replay test selection.
      build-dos-artifact: true
      cameras: ${{ inputs.cameras }}
      targets: ${{ inputs.targets }}
      # Convert the dispatch payload string to the reusable workflow's numeric input.
      renderer-test-percentage: ${{ fromJSON(github.event.inputs.renderer-test-percentage) }}

  packages:
    name: All release packages
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-packages.yml
    with:
      dos-artifact: ${{ needs.validate.outputs.exe-artifact }}
      amiga-artifact: ${{ needs.validate.outputs.amiga-artifact }}
      templeos-artifact: ${{ needs.validate.outputs.templeos-artifact }}
      attest: true
      android-release: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    name: Publish the release
    needs: [check-tag, validate, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Verify provenance, upload, verify bytes, and publish immutably
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$DRAFT" == "true" ]]; then
              flags+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
              flags+=(--prerelease)
          fi
          python3 tools/scripts/publish-release.py publish --directory dist \
              --tag "$TAG" --title="$TITLE" --platforms "$PLATFORMS" "${flags[@]}"
