name: Replay tests

# Run and validate one replay phase. The caller gates rendering on physics.
on:
  workflow_call:
    inputs:
      phase:
        description: Replay phase to run (physics or renderer).
        type: string
        required: true
      exe-artifact:
        description: Built DOS executables and both original dump references, required for every phase.
        type: string
        default: ''
      candidate-platform:
        description: Candidate dump tools to execute (dos or sdl3).
        type: string
        default: dos
      native-artifact:
        description: Artifact holding sdl3-runtime.tar.gz when testing SDL3.
        type: string
        default: ''
      shard-matrix:
        description: JSON array of shard indices from the validated plan.
        type: string
        required: true
      shard-plan-artifact:
        description: Artifact containing precomputed target<target>.json shard plans.
        type: string
        required: true
      shards:
        type: number
        required: true
      partitions-per-shard:
        type: number
        required: true
      replay-timeout-seconds:
        type: number
        required: true
      camera:
        description: Renderer camera (integer 1-4, corresponding to F1-F4).
        type: number
        default: 2
      target:
        description: Renderer target (0 for player, 1 for opponent).
        type: number
        default: 0
      renderer-test-percentage:
        type: number
        required: true
      renderer-timeout-seconds:
        type: number
        required: true

env:
  CAMERA: ${{ inputs.camera }}
  TARGET: ${{ inputs.target }}
  SHARD_PLAN: shard-plan/target${{ inputs.target }}.json
  PHYSICS_TESTS: ${{ inputs.phase == 'physics' }}
  RENDERER_TESTS: ${{ inputs.phase == 'renderer' }}

jobs:
  replay:
    name: Replays (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate candidate platform
        env:
          CANDIDATE_PLATFORM: ${{ inputs.candidate-platform }}
          DOS_ARTIFACT: ${{ inputs.exe-artifact }}
          NATIVE_ARTIFACT: ${{ inputs.native-artifact }}
        run: |
          case "$CANDIDATE_PLATFORM" in
            dos) ;;
            sdl3) test -n "$NATIVE_ARTIFACT" ;;
            *) echo "::error::candidate-platform must be dos or sdl3"; exit 1 ;;
          esac
          if [[ -z "$DOS_ARTIFACT" ]]; then
              echo "::error::replay tests require the built DOS reference artifact"
              exit 1
          fi

      - name: Validate camera and target
        run: |
          if [[ ! "$CAMERA" =~ ^[1-4]$ ]]; then
              echo "::error::camera must be an integer from 1 to 4"
              exit 1
          fi
          if [[ ! "$TARGET" =~ ^[01]$ ]]; then
              echo "::error::target must be 0 (player) or 1 (opponent)"
              exit 1
          fi

      - name: Download the replay shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.shard-plan-artifact }}
          path: shard-plan

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the shared regression runner
        run: dotnet publish tools/scripts/dumpsrv/dumpsrv/dumpsrv.csproj --configuration Release --output "$RUNNER_TEMP/dumpsrv"

      - name: Install DOSBox-X
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosbox-x

      - name: Initialize DOSBox-X before concurrent runs
        run: |
          timeout --signal=KILL 30s dosbox-x -silent \
              -conf tools/scripts/dosbox.proc.conf \
              -c "mount c $RUNNER_TEMP" -c "c:" -c "exit"

      - name: Download the DOS executables and original references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.exe-artifact }}
          path: exes

      - name: Download the SDL3 runtime
        if: inputs.candidate-platform == 'sdl3'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.native-artifact }}
          path: native-package

      - name: Restore the SDL3 runtime
        if: inputs.candidate-platform == 'sdl3'
        run: |
          mkdir -p "$RUNNER_TEMP/sdl3"
          tar -xzf native-package/sdl3-runtime.tar.gz -C "$RUNNER_TEMP/sdl3"
          test -x "$RUNNER_TEMP/sdl3/bin/repldump"
          test -x "$RUNNER_TEMP/sdl3/bin/pixldump"

      - name: Assemble the game directory
        env:
          STUNTS_URL: https://github.com/CommonLoon102/restunts4d-oracles/releases/download/v1.0.1/BB11.zip
          CANDIDATE_PLATFORM: ${{ inputs.candidate-platform }}
        run: |
          set -eu
          game_dir="$RUNNER_TEMP/gamedir"
          zip_path="$RUNNER_TEMP/BB11.zip"
          trap 'rm -f -- "$zip_path"' EXIT
          mkdir -p "$game_dir"
          curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 20 "$STUNTS_URL" --output "$zip_path"
          unzip -oq "$zip_path" -d "$game_dir"
          # Custom cars use mixed-case extensions; copy the complete asset pack.
          cp -R tools/scripts/cars/. "$game_dir/"
          # Original-engine oracle tools still require loose car resources.
          cp -R assets/cars/. "$game_dir/"
          # The archived golden corpus is the complete replay set for CI.
          find "$game_dir" -maxdepth 1 -type f -iname '*.rpl' -delete
          if [[ "$CANDIDATE_PLATFORM" == dos ]]; then
              cp exes/*.exe "$game_dir/"
          fi
          # Both phases regenerate missing caches with the freshly built original engine.
          for oracle in repldumo pixldumo; do
              if [[ ! -s "exes/$oracle.exe" ]]; then
                  echo "::error::built original dump reference exes/$oracle.exe is missing or empty"
                  exit 1
              fi
              cp "exes/$oracle.exe" "$game_dir/"
          done
          unzip -q tools/scripts/rpls_golden/replays.zip -d "$game_dir"
          echo "GAME_DIR=$game_dir" >> "$GITHUB_ENV"

      - name: Download and extract this shard's precomputed oracle outputs
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
          ORACLE_URL: https://github.com/CommonLoon102/restunts4d-oracles/releases/download/v1.0.5
        run: |
          set -eu
          archive=BINs
          if [[ "$RENDERER_TESTS" == "true" ]]; then
              archive="PDOs-cam$CAMERA-target$TARGET"
          fi
          zip_path="$RUNNER_TEMP/$archive.zip"
          trap 'rm -f -- "$zip_path"' EXIT
          # Download only the oracle archive needed by this phase.
          if ! curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 20 "$ORACLE_URL/$archive.zip" --output "$zip_path"; then
              echo "::warning::Could not download $archive.zip; missing oracle outputs will be generated locally."
              exit 0
          fi
          # The full BIN archive expands to over 15 GB. Extract only assigned
          # replays from the same JSON plan used by the test runner.
          dotnet "$RUNNER_TEMP/dumpsrv/dumpsrv.dll" extract-oracles \
              -GameDirectory "$GAME_DIR" -Archive "$zip_path" \
              -Renderer "$RENDERER_TESTS" -RendererTestPercentage "$RENDERER_TEST_PERCENTAGE" \
              -Camera "$CAMERA" -Target "$TARGET" \
              -ShardIndex "$SHARD" -ShardCount "$SHARDS" \
              -ShardPlan "$SHARD_PLAN"

      - name: Normalize unsupported scenery in renderer input copies
        if: inputs.phase == 'renderer'
        run: python3 tools/scripts/normalize-track-skybox.py --in-place "$GAME_DIR"

      - name: Run this shard's ${{ inputs.phase }} tests
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          PARTITIONS_PER_SHARD: ${{ inputs.partitions-per-shard }}
          REPLAY_TIMEOUT_SECONDS: ${{ inputs.replay-timeout-seconds }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
          RENDERER_TIMEOUT_SECONDS: ${{ inputs.renderer-timeout-seconds }}
          CANDIDATE_PLATFORM: ${{ inputs.candidate-platform }}
        run: |
          native_args=()
          if [[ "$CANDIDATE_PLATFORM" == sdl3 ]]; then
              native_args+=(-NativeDirectory "$RUNNER_TEMP/sdl3/bin")
          fi
          dotnet "$RUNNER_TEMP/dumpsrv/dumpsrv.dll" run \
              -GameDirectory "$GAME_DIR" \
              -OutputDirectory partitions \
              -CandidatePlatform "$CANDIDATE_PLATFORM" "${native_args[@]}" \
              -DosBoxConfigPath tools/scripts/dosbox.proc.conf \
              -PartitionCount "$PARTITIONS_PER_SHARD" \
              -PhysicsTests "$PHYSICS_TESTS" -RendererTests "$RENDERER_TESTS" \
              -Camera "$CAMERA" -Target "$TARGET" \
              -ShardIndex "$SHARD" -ShardCount "$SHARDS" \
              -ShardPlan "$SHARD_PLAN" \
              -DosBoxTimeoutSeconds "$REPLAY_TIMEOUT_SECONDS" \
              -RendererTimeoutSeconds "$RENDERER_TIMEOUT_SECONDS" \
              -RendererTestPercentage "$RENDERER_TEST_PERCENTAGE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ inputs.candidate-platform == 'sdl3' && 'sdl3-' || '' }}${{ inputs.phase }}-partitions-cam${{ inputs.camera }}-target${{ inputs.target }}-${{ matrix.shard }}
          path: partitions/*.json
          # Missing shards are diagnosed by the shared merge command.
          if-no-files-found: warn
          retention-days: 14

      - name: Upload this shard's PDO files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && inputs.phase == 'renderer' }}
        with:
          name: ${{ inputs.candidate-platform == 'sdl3' && 'sdl3-' || '' }}renderer-pdo-cam${{ inputs.camera }}-target${{ inputs.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/gamedir/**/*.[pP][dD][oO]
          include-hidden-files: true
          # A shard may have no replays in the renderer sample.
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Check replay coverage
    needs: replay
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the replay shard plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.shard-plan-artifact }}
          path: shard-plan

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the shared regression runner
        run: dotnet publish tools/scripts/dumpsrv/dumpsrv/dumpsrv.csproj --configuration Release --output "$RUNNER_TEMP/dumpsrv"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          pattern: ${{ inputs.candidate-platform == 'sdl3' && 'sdl3-' || '' }}${{ inputs.phase }}-partitions-cam${{ inputs.camera }}-target${{ inputs.target }}-*
          merge-multiple: true
          path: partitions

      - name: Merge the shard results and check coverage
        env:
          SHARDS: ${{ inputs.shards }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
          CANDIDATE_PLATFORM: ${{ inputs.candidate-platform }}
        run: |
          mkdir -p partitions "$RUNNER_TEMP/replays"
          unzip -q tools/scripts/rpls_golden/replays.zip -d "$RUNNER_TEMP/replays"
          dotnet "$RUNNER_TEMP/dumpsrv/dumpsrv.dll" merge \
              -ReplayDirectory "$RUNNER_TEMP/replays" \
              -CandidatePlatform "$CANDIDATE_PLATFORM" \
              -ResultsDirectory partitions -ShardCount "$SHARDS" \
              -ShardPlan "$SHARD_PLAN" \
              -PhysicsTests "$PHYSICS_TESTS" -RendererTests "$RENDERER_TESTS" \
              -Camera "$CAMERA" -Target "$TARGET" \
              -RendererTestPercentage "$RENDERER_TEST_PERCENTAGE" \
              -OutputFile partitions_all.txt \
              -SummaryFile "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ inputs.candidate-platform == 'sdl3' && 'sdl3-' || '' }}${{ inputs.phase }}-cam${{ inputs.camera }}-target${{ inputs.target }}-report
          path: partitions_all.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Combine all PDO files into a downloadable ZIP
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() && inputs.phase == 'renderer' }}
        with:
          name: ${{ inputs.candidate-platform == 'sdl3' && 'sdl3-' || '' }}renderer-pdo-cam${{ inputs.camera }}-target${{ inputs.target }}
          pattern: ${{ inputs.candidate-platform == 'sdl3' && 'sdl3-' || '' }}renderer-pdo-cam${{ inputs.camera }}-target${{ inputs.target }}-*
          include-hidden-files: true
          retention-days: 14

      - name: Check replay jobs completed successfully
        if: always()
        env:
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: |
          if [[ "$REPLAY_RESULT" != "success" ]]; then
              echo "::error::a replay shard did not finish successfully (result: $REPLAY_RESULT)"
              printf '\n:x: A replay shard did not finish successfully (result: **%s**).\n' \
                  "$REPLAY_RESULT" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi
