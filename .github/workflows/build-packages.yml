name: Build release packages

# Reused by PR validation and Release. Packages are archived before upload;
# the publishing job downloads these exact bytes and never rebuilds them.
on:
  workflow_call:
    inputs:
      dos-artifact:
        description: The six DOS16 executables produced by build-and-validate.
        type: string
        required: true
      attest:
        description: Attest package archives and checksums for a release run.
        type: boolean
        default: false
      android-release:
        description: Build signed Android release APKs for a trusted release dispatch.
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Base64-encoded Android release keystore.
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        description: Android release keystore password.
        required: false
      ANDROID_KEY_ALIAS:
        description: Alias of the Android release signing key.
        required: false
      ANDROID_KEY_PASSWORD:
        description: Android release signing key password.
        required: false

# Inherit the caller's permissions: PRs are read-only; releases additionally
# grant OIDC and attestation writes to the guarded provenance steps.
jobs:
  android:
    name: Package ${{ matrix.target }} (Android 5+)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [android-armv7, android-arm64]
    defaults:
      run:
        shell: bash
    steps:
      - name: Reject signing requests from non-release events
        if: inputs.android-release && github.event_name != 'workflow_dispatch'
        run: |
          echo 'Signed Android packages require a trusted release workflow dispatch.' >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select the runner's Java 17 toolchain
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install the pinned Android SDK, NDK and CMake
        run: bash tools/scripts/install-android-package-dependencies.sh

      - name: Test Android imports and package validation
        run: |
          "$JAVA_HOME/bin/javac" -d "$RUNNER_TEMP/android-import-tests" \
            android/app/src/main/java/org/restunts/android/GameDataImport.java \
            android/app/src/main/java/org/restunts/android/GameDataVersion.java \
            android/app/src/main/java/org/restunts/android/LaunchOptions.java \
            android/app/src/main/java/org/restunts/android/GameDataSync.java \
            android/app/src/main/java/org/restunts/android/LocalGameFolder.java \
            android/tests/GameDataImportTest.java android/tests/GameDataVersionTest.java \
            android/tests/LaunchOptionsTest.java \
            android/tests/GameDataSyncTest.java android/tests/LocalGameFolderTest.java
          "$JAVA_HOME/bin/java" -cp "$RUNNER_TEMP/android-import-tests" \
            org.restunts.android.GameDataImportTest
          "$JAVA_HOME/bin/java" -cp "$RUNNER_TEMP/android-import-tests" \
            org.restunts.android.GameDataVersionTest
          "$JAVA_HOME/bin/java" -cp "$RUNNER_TEMP/android-import-tests" \
            org.restunts.android.LaunchOptionsTest
          "$JAVA_HOME/bin/java" -cp "$RUNNER_TEMP/android-import-tests" \
            org.restunts.android.GameDataSyncTest
          "$JAVA_HOME/bin/java" -cp "$RUNNER_TEMP/android-import-tests" \
            org.restunts.android.LocalGameFolderTest
          python3 tools/scripts/test-release-packages.py

      - name: Build and verify the ABI-specific debug APK and runtime archive
        if: ${{ !inputs.android-release }}
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: bash tools/scripts/build-package.sh "$PACKAGE_TARGET"

      - name: Build and verify the signed ABI-specific release APK and runtime archive
        if: inputs.android-release && github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          RESTUNTS_ANDROID_BUILD_TYPE: release
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for signing_input in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD \
              ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [[ -z "${!signing_input:-}" ]]; then
                  echo "Missing required Android signing secret: $signing_input" >&2
                  exit 1
              fi
          done
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/restunts-android-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
              > "$signing_dir/release.keystore"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE_FILE="$signing_dir/release.keystore"
          if [[ ! -s "$ANDROID_KEYSTORE_FILE" ]]; then
              echo 'The decoded Android release keystore is empty.' >&2
              exit 1
          fi
          bash tools/scripts/build-package.sh "$PACKAGE_TARGET"

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attest the package and its checksum
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/packages/*

  cross:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - dos32
          - linux-arm32
          - linux-arm64
          - linux-x86
          - linux-x86-no-sse2
          - linux-x64
          - windows-arm64
          - windows-x86
          - windows-x86-no-sse2
          - windows-x64
          - browser
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian 12 build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            git curl ca-certificates pkg-config python3 unzip xz-utils bzip2 libfl2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install target dependencies and verified cross compilers
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: bash tools/scripts/install-package-dependencies.sh "$PACKAGE_TARGET"

      - name: Build and verify the complete runtime archive
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: bash tools/scripts/build-package.sh "$PACKAGE_TARGET"

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attest the package and its checksum
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/packages/*

  bsd:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - freebsd-x64
          - openbsd-x64
          - netbsd-x64
          - netbsd-x86
          - netbsd-x86-no-sse2
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the FreeBSD 14.4 x86-64 package
        if: matrix.target == 'freebsd-x64'
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          release: '14.4'
          arch: x86_64
          sync: rsync
          envs: PACKAGE_TARGET GITHUB_SHA GITHUB_REF GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          run: |
            set -eu
            sh tools/scripts/install-bsd-package-dependencies.sh "$PACKAGE_TARGET"
            bash tools/scripts/build-package.sh "$PACKAGE_TARGET"

      - name: Build the OpenBSD 7.9 x86-64 package
        if: matrix.target == 'openbsd-x64'
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          release: '7.9'
          arch: x86_64
          sync: rsync
          envs: PACKAGE_TARGET GITHUB_SHA GITHUB_REF GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          run: |
            set -eu
            sh tools/scripts/install-bsd-package-dependencies.sh "$PACKAGE_TARGET"
            bash tools/scripts/build-package.sh "$PACKAGE_TARGET"

      - name: Build the NetBSD 10.2 package in its native userspace
        if: startsWith(matrix.target, 'netbsd-')
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          release: '10.2'
          arch: x86_64
          sync: rsync
          envs: PACKAGE_TARGET GITHUB_SHA GITHUB_REF GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          prepare: |
            /usr/sbin/pkg_add curl git-base mozilla-rootcerts-openssl
          run: |
            set -eu
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
            if [ "$PACKAGE_TARGET" = netbsd-x86 ] || [ "$PACKAGE_TARGET" = netbsd-x86-no-sse2 ]; then
              sh tools/scripts/build-netbsd-x86-package.sh "$PACKAGE_TARGET"
            else
              sh tools/scripts/install-bsd-package-dependencies.sh "$PACKAGE_TARGET"
              bash tools/scripts/build-package.sh "$PACKAGE_TARGET"
            fi

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attest the package and its checksum
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/packages/*

  haiku:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [haiku-x64, haiku-x86]
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test the Haiku VM helper
        run: python3 -m unittest discover -s tools/scripts/tests -p test_haiku_vm.py

      - name: Download and verify native regression test assets
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/CommonLoon102/restunts4d-oracles/releases/download/v1.0.1/BB11.zip \
            --output "$RUNNER_TEMP/BB11.zip"
          echo "71fd29f55c726a5f1ee6a6073275708cdb6eb2799a25b1a83b44ed0c01742511  $RUNNER_TEMP/BB11.zip" \
            | sha256sum --check --strict
          unzip -oq "$RUNNER_TEMP/BB11.zip" -d stunts

      - name: Install the Haiku VM host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils zstd
          # The hosted CI time budget assumes hardware acceleration.
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Assemble the Haiku R1 beta 6 x86 disk
        if: matrix.target == 'haiku-x86'
        run: |
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" \
            prepare-x86 --accel kvm

      - name: Boot the Haiku VM and upload sources
        run: |
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" \
            start --arch "${PACKAGE_TARGET#haiku-}" --accel kvm
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" \
            upload "$GITHUB_WORKSPACE" /boot/home/restunts

      - name: Install and activate native build dependencies
        run: |
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" ssh \
            sh /boot/home/restunts/tools/scripts/install-haiku-package-dependencies.sh "$PACKAGE_TARGET"
          # A Haiku system update defers package activation until the next boot.
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" stop
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" \
            start --arch "${PACKAGE_TARGET#haiku-}" --accel kvm

      - name: Build and test in the Haiku VM
        run: |
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" ssh env \
            PACKAGE_TARGET="$PACKAGE_TARGET" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            bash -c 'set -eu; cd /boot/home/restunts
              bash tools/scripts/build-package.sh "$PACKAGE_TARGET"'
          mkdir -p dist
          python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" \
            download /boot/home/restunts/dist/packages dist/

      - name: Shut down the Haiku VM
        if: always()
        run: python3 tools/scripts/haiku-vm.py --directory "$RUNNER_TEMP/haiku-vm" stop

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attest the package and its checksum
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/packages/*

  dos16:
    name: Package DOS16 validation artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.dos-artifact }}
          path: build/dos16-executables

      - name: Check package integrity validation
        run: python3 tools/scripts/test-release-packages.py

      - name: Package the already built DOS16 executables
        run: bash tools/scripts/build-package.sh dos16 build/dos16-executables

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-dos16
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attest the package and its checksum
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/packages/*

  macos:
    name: Package macOS Universal
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build both architectures with a macOS 11.0 deployment target
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: bash tools/scripts/build-package.sh macos-universal

      - name: Upload immutable package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-macos-universal
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Attest the package and its checksum
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/packages/*
