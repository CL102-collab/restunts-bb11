name: Verify workflow lockfile

on:
  pull_request:
  push:
    branches: [main, integ2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify action dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the lockfile verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify direct and transitive action dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
