plugins {
    id 'com.android.application'
}

def toolchain = new Properties()
rootProject.file('toolchain.properties').withInputStream { toolchain.load(it) }
def releaseSigning = ['ANDROID_KEYSTORE_FILE', 'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].collectEntries { name ->
    [(name): providers.environmentVariable(name).orNull]
}
def releaseSigningConfigured = releaseSigning.values().every { it != null && !it.isEmpty() }
def sharedJava = file('../app/src/main/java')
def storageSources = layout.buildDirectory.dir('generated/storage-java')
def prepareStorage = tasks.register('prepareGenghostStorageJava', Sync) {
    from(sharedJava) {
        include 'org/restunts/android/GameDataStorage.java'
        include 'org/restunts/android/GameDataSync.java'
        include 'org/restunts/android/GameDataVersion.java'
        include 'org/restunts/android/GameDataImport.java'
        include 'org/restunts/android/GameFolder.java'
        include 'org/restunts/android/LocalGameFolder.java'
    }
    into storageSources
}

android {
    namespace 'org.restunts.genghost'
    compileSdk Integer.parseInt(toolchain.getProperty('ANDROID_COMPILE_SDK'))
    buildToolsVersion toolchain.getProperty('ANDROID_BUILD_TOOLS')
    ndkVersion toolchain.getProperty('ANDROID_NDK')

    defaultConfig {
        applicationId 'org.restunts.genghost'
        targetSdk Integer.parseInt(toolchain.getProperty('ANDROID_COMPILE_SDK'))
        versionCode 8
        versionName '1.0.7'
        externalNativeBuild {
            cmake {
                arguments '-DRESTUNTS_GENGHOST_ONLY=ON', '-DRESTUNTS_BUILD_TESTS=OFF',
                    '-DANDROID_STL=c++_static',
                    "-DFETCHCONTENT_SOURCE_DIR_SDL3=${file('../../out/android-deps/sdl').absolutePath}"
                targets 'genghost'
            }
        }
    }

    flavorDimensions 'cpu'
    productFlavors {
        armv7 {
            dimension 'cpu'
            minSdk Integer.parseInt(toolchain.getProperty('ANDROID_ARMV7_MIN_SDK'))
            ndk { abiFilters 'armeabi-v7a' }
        }
        arm64 {
            dimension 'cpu'
            minSdk Integer.parseInt(toolchain.getProperty('ANDROID_ARM64_MIN_SDK'))
            ndk { abiFilters 'arm64-v8a' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main {
        assets.srcDirs 'generated-assets'
        java.srcDir storageSources
    }
    externalNativeBuild {
        cmake {
            def androidBuildRoot = providers.gradleProperty('restuntsAndroidBuildRoot')
            if (androidBuildRoot.isPresent()) {
                buildStagingDirectory file("${androidBuildRoot.get()}/genghost/.cxx")
            }
            path '../../CMakeLists.txt'
            version toolchain.getProperty('ANDROID_CMAKE')
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigning['ANDROID_KEYSTORE_FILE'])
                storePassword releaseSigning['ANDROID_KEYSTORE_PASSWORD']
                keyAlias releaseSigning['ANDROID_KEY_ALIAS']
                keyPassword releaseSigning['ANDROID_KEY_PASSWORD']
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            externalNativeBuild.cmake.arguments '-DCMAKE_BUILD_TYPE=Debug'
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            externalNativeBuild.cmake.arguments '-DCMAKE_BUILD_TYPE=Release'
        }
    }
    // AGP recognizes the lib*.so executable in its CMake model. Its parent directory must be
    // the ABI name, and it must have only that one packaging source to avoid duplicate entries.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libgenghost_exec.so']
        }
    }
}

// Copy a narrow source set instead of exposing the game Activity and its SDL Java dependency.
tasks.named('preBuild').configure { dependsOn prepareStorage }
